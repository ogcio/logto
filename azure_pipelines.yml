# OGCIO

trigger:
  - dev
  - uat

pr:
  autoCancel: true
  branches:
    include:
      - "*"

parameters:
  - name: buildBranches
    type: object
    default: ["dev", "uat", 'prod']

  - name: validEnvironments
    type: object
    displayName: List of valid environments to deploy (do not change)
    default: ['dev', 'uat', 'prod']

variables:
  - name: pushArtefacts
    value: ${{ containsValue(parameters.buildBranches, variables['Build.SourceBranchName']) }}
  - ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
    - template: pipeline-variables/${{ coalesce(variables['Build.SourceBranchName'], 'fallback') }}.yml
  - ${{ else }}:
    - template: pipeline-variables/dev.yml
  - group: ogcio-e2e-test-creds

resources:
  repositories:
    - repository: pipeline-templates
      type: github
      name: ogcio/building-blocks-pipelines
      ref: refs/tags/v0.5.2
      endpoint: ogcio
    - repository: logto-k8s-apps
      type: github
      name: ogcio/logto-k8s-apps
      ref: main
      endpoint: ogcio
    - repository: mygovid-mock-k8s-apps
      type: github
      name: ogcio/mygovid-mock-k8s-apps
      ref: main
      endpoint: ogcio

stages:
  - stage: securityScan
    displayName: Security Scans
    jobs:
      - template: security/gitleaks.yml@pipeline-templates
  - stage: Build_Logto
    displayName: Build Logto
    dependsOn: 
      - securityScan
    jobs:  
    - template: pipeline-templates/build_service.yml
      parameters:
        serviceName: logto
        pushArtefacts: ${{ variables.pushArtefacts }}
        buildArguments: $(buildArguments)
  - stage: Build_MyGovId_Mock
    displayName: Build MyGovId Mock
    dependsOn: 
      - securityScan
    condition: or(eq(variables['Build.SourceBranchName'], 'dev'),eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - template: pipeline-templates/build_service.yml
      parameters:
        serviceName: mygovid-mock-service
        pushArtefacts: true
        buildArguments: $(buildArguments)
        dockerfile: ./mygovid-mock-service/Dockerfile
  - stage: Build_Logto_Audit_Cleaner
    displayName: Build Logto Audit Cleaner
    dependsOn: 
      - securityScan
    jobs:
    - template: pipeline-templates/build_service.yml
      parameters:
        serviceName: logto-audit-cleaner
        pushArtefacts: true
        buildArguments: $(buildArguments)
        dockerfile: ./audit-cleaner/Dockerfile
  - stage: Push_Logto_Audit_Cleaner
    displayName: Push Logto Audit Cleaner to ECR
    dependsOn: 
      - EnvApproval
      - Build_Logto_Audit_Cleaner
    condition: succeeded()
    jobs:
    - template: build/push_image_ecr.yml@pipeline-templates
      parameters:
        awsServiceConnection: ${{ variables.awsServiceConnection }}
        awsRegion: ${{ variables.awsRegion }}
        serviceName: logto-audit-cleaner
        repositoryName: bb-logto-audit-cleaner
        pushTag: $(Build.BuildId)
  - stage: OGCIO_E2E_Tests
    displayName: OGCIO E2E Tests
    dependsOn: 
      - Build_Logto
      - Build_Logto_Audit_Cleaner
    condition: or(eq(variables['Build.SourceBranchName'], 'dev'), eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: PlaywrightTests
        displayName: Run Playwright E2E Tests
        pool:
          vmImage: 'ubuntu-latest'
        
        variables:
          # Environment variables for the tests
          LOGTO_ADMIN_URL: 'http://localhost:3302'
          TEST_USERNAME: $(OGCIO_TEST_USERNAME)
          TEST_PASSWORD: $(OGCIO_TEST_PASSWORD)

        steps:
          - checkout: self
            displayName: 'Checkout source code'

          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: '20.x'

          - script: |
              npm install -g pnpm@9
            displayName: 'Install pnpm v9'

          - script: |
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              npx playwright install chromium
            displayName: 'Install Playwright browsers'

          - script: |
              echo "🚀 Starting Logto with make run-native in background..."
              nohup make run-native > logto-startup.log 2>&1 &
              
              echo "⏱️ Waiting for Logto to initialize (max 10 minutes)..."
              echo "Started waiting at: $(date)"
              
              # Poll for server availability with timeout
              MAX_WAIT=600  # 10 minutes in seconds
              WAIT_INTERVAL=10  # Check every 10 seconds
              ELAPSED=0
              
              while [ $ELAPSED -lt $MAX_WAIT ]; do
                if curl -s http://localhost:3302/ > /dev/null; then
                  echo "✅ Server is responding at http://localhost:3302/ after $ELAPSED seconds"
                  break
                fi
                
                echo "⏳ Server not ready yet, waiting... ($ELAPSED seconds elapsed)"
                sleep $WAIT_INTERVAL
                ELAPSED=$((ELAPSED + WAIT_INTERVAL))
                
                # Print some logs periodically
                if [ $((ELAPSED % 60)) -eq 0 ]; then
                  echo "📋 Recent log entries:"
                  tail -20 logto-startup.log
                fi
              done
              
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "⚠️ WARNING: Timed out waiting for server to respond!"
                echo "⚠️ Last 50 lines of logto-startup.log:"
                tail -50 logto-startup.log
              else
                # Give it a bit more time to fully stabilize
                echo "🔍 Server responded, waiting additional 30 seconds for full initialization..."
                sleep 30
                echo "✅ Proceeding with tests now"
              fi
              
              # Final check and verification
              echo "🔄 Testing server with HTTP request:"
              curl -v http://localhost:3302/ || echo "⚠️ Server not responding to final check!"
              
              # Report network status for debugging
              echo "📡 Network status:"
              netstat -tulpn | grep LISTEN
            displayName: 'Start Logto and wait for initialization'

          - script: |
              echo "📝 Pre-test diagnostics:"
              echo "Running tests against: $(LOGTO_ADMIN_URL)"
              echo "Environment: $(environment)"
              echo "Test start time: $(date)"
              echo "Using username: $(TEST_USERNAME)"
              echo "Password provided: $(if [ -n \"$(TEST_PASSWORD)\" ]; then echo 'Yes'; else echo 'No'; fi)"
              
              # Verify server is still up
              echo "🔄 Testing server one more time before tests:"
              curl -s -o /dev/null -w "%{http_code}\n" http://localhost:3302/
              
              # Debug log
              echo "🔍 Test environment variables:"
              env | grep -E 'LOGTO|TEST|PLAYWRIGHT' || echo "No matching variables found"
              
              # Run tests with increased timeouts for CI environment and debug flag
              echo "🚀 Running Playwright tests with debug mode and retries..."
              PLAYWRIGHT_DRIVER_TIMEOUT=180000 PLAYWRIGHT_REUSE_CONTEXT=1 pnpm exec playwright test --project=chromium --timeout=120000 --debug --retries=2 --workers=1
              TEST_RESULT=$?
              
              echo "Test end time: $(date)"
              echo "Test exit code: $TEST_RESULT"
              
              # Diagnostic checks
              echo "📊 Post-test diagnostics:"
              
              # List all test artifacts that were generated
              echo "🗂️ Test artifacts generated:"
              find test-results -type f | grep -E '\.(webm|png|zip)$' || echo "No artifacts found"
              
              # Count videos to ensure they were created
              VIDEO_COUNT=$(find test-results -name "*.webm" | wc -l)
              echo "Number of video files generated: $VIDEO_COUNT"
              
              # If tests fail, show detailed diagnostics
              if [ $TEST_RESULT -ne 0 ]; then
                echo "⚠️ Tests failed! Showing Logto startup log:"
                cat logto-startup.log
                
                echo "🔄 Final server check:"
                curl -v http://localhost:3302/ || echo "Server not responding"
                
                echo "💻 System resource status:"
                free -h
                df -h
                top -b -n 1 | head -20
              fi
              
              exit $TEST_RESULT
            displayName: 'Run Playwright Tests'
            env:
              LOGTO_ADMIN_URL: $(LOGTO_ADMIN_URL)
              TEST_USERNAME: $(TEST_USERNAME)
              TEST_PASSWORD: $(TEST_PASSWORD)
              CI: true
              DEBUG: pw:api,pw:browser*
              PLAYWRIGHT_BROWSER_TIMEOUT: 180000

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/results.xml'
              testRunTitle: 'OGCIO E2E Tests - $(environment)'
              mergeTestResults: true

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Playwright Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Test Results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'test-results-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'
  - stage: EnvApproval
    displayName: Approvals for deployments - ${{ upper(variables.environment) }}
    dependsOn:
      - Build_Logto
      - OGCIO_E2E_Tests
    condition: ${{ variables.pushArtefacts }}
    jobs:
    - deployment: VerifyDeployment
      displayName: Verify conditions for deployment
      environment: ${{ variables.environment }}
      strategy:
        runOnce:
          deploy:
            steps:
            - script: |
                date
              displayName: Show current date
  - stage: Push_Logto
    displayName: Push logto to ECR
    dependsOn: EnvApproval
    condition: and(${{ variables.pushArtefacts }}, succeeded())
    jobs:
    - template: build/push_image_ecr.yml@pipeline-templates
      parameters:
        awsServiceConnection: ${{ variables.awsServiceConnection }}
        awsRegion: ${{ variables.awsRegion }}
        serviceName: logto
        repositoryName: bb-logto
        pushTag: $(Build.BuildId)
  - stage: Push_MyGovId_Mock
    displayName: Push MyGovId Mock to ECR
    dependsOn: 
      - EnvApproval
      - Build_MyGovId_Mock
    condition: and(eq(variables['Build.SourceBranchName'], 'dev'), succeeded())
    jobs:
    - template: build/push_image_ecr.yml@pipeline-templates
      parameters:
        awsServiceConnection: ${{ variables.awsServiceConnection }}
        awsRegion: ${{ variables.awsRegion }}
        serviceName: mygovid-mock-service
        repositoryName: bb-mygovid-mock
        pushTag: $(Build.BuildId)
  - stage: Deploy_Openshift_MyGovId_Mock
    displayName: GitOps deploy MyGovId Mock
    dependsOn:
      - Push_MyGovId_Mock
    condition: succeeded()
    jobs:
    - template: deploy/gitops.yml@pipeline-templates
      parameters:
        serviceName: mygovid-mock
        clusterName: ${{ variables.clusterName }}
        newName: ${{ variables.ecrEndpoint }}/bb-mygovid-mock
        newTag: $(Build.BuildId)
        environment: dev
  - stage: Deploy_Openshift_Logto
    displayName: GitOps deploy Logto
    dependsOn:
      - EnvApproval
      - Push_Logto
      - Push_Logto_Audit_Cleaner
    condition: succeeded()
    jobs:
      - template: deploy/openshift-gitops.yml@pipeline-templates
        parameters:
          tag: $(Build.BuildId)
          manifestsRepositoryName: logto-k8s-apps
          services:
            - name: logto
              image: ${{ variables.ecrEndpoint }}/bb-logto
              ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/${{ variables['Build.SourceBranchName'] }}
              ${{ else }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/dev
            - name: bb-logto-audit-cleaner
              image: ${{ variables.ecrEndpoint }}/bb-logto-audit-cleaner
              ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/${{ variables['Build.SourceBranchName'] }}
              ${{ else }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/dev
