# OGCIO

trigger:
  - dev
  - uat

pr:
  autoCancel: true
  branches:
    include:
      - "*"

parameters:
  - name: buildBranches
    type: object
    default: ["dev", "uat", 'prod']

  - name: validEnvironments
    type: object
    displayName: List of valid environments to deploy (do not change)
    default: ['dev', 'uat', 'prod']

variables:
  - name: pushArtefacts
    value: ${{ containsValue(parameters.buildBranches, variables['Build.SourceBranchName']) }}
  - ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
    - template: pipeline-variables/${{ coalesce(variables['Build.SourceBranchName'], 'fallback') }}.yml
  - ${{ else }}:
    - template: pipeline-variables/dev.yml
  - group: ogcio-e2e-test-creds

resources:
  repositories:
    - repository: pipeline-templates
      type: github
      name: ogcio/building-blocks-pipelines
      ref: refs/tags/v0.5.2
      endpoint: ogcio
    - repository: logto-k8s-apps
      type: github
      name: ogcio/logto-k8s-apps
      ref: main
      endpoint: ogcio
    - repository: mygovid-mock-k8s-apps
      type: github
      name: ogcio/mygovid-mock-k8s-apps
      ref: main
      endpoint: ogcio

stages:
  - stage: securityScan
    displayName: Security Scans
    jobs:
      - template: security/gitleaks.yml@pipeline-templates
  - stage: Build_Logto
    displayName: Build Logto
    dependsOn: 
      - securityScan
    jobs:  
    - template: pipeline-templates/build_service.yml
      parameters:
        serviceName: logto
        pushArtefacts: ${{ variables.pushArtefacts }}
        buildArguments: $(buildArguments)
  - stage: Build_MyGovId_Mock
    displayName: Build MyGovId Mock
    dependsOn: 
      - securityScan
    condition: or(eq(variables['Build.SourceBranchName'], 'dev'),eq(variables['Build.Reason'], 'PullRequest'))
    jobs:
    - template: pipeline-templates/build_service.yml
      parameters:
        serviceName: mygovid-mock-service
        pushArtefacts: true
        buildArguments: $(buildArguments)
        dockerfile: ./mygovid-mock-service/Dockerfile
  - stage: Build_Logto_Audit_Cleaner
    displayName: Build Logto Audit Cleaner
    dependsOn: 
      - securityScan
    jobs:
    - template: pipeline-templates/build_service.yml
      parameters:
        serviceName: logto-audit-cleaner
        pushArtefacts: true
        buildArguments: $(buildArguments)
        dockerfile: ./audit-cleaner/Dockerfile
  - stage: Push_Logto_Audit_Cleaner
    displayName: Push Logto Audit Cleaner to ECR
    dependsOn: 
      - EnvApproval
      - Build_Logto_Audit_Cleaner
    condition: succeeded()
    jobs:
    - template: build/push_image_ecr.yml@pipeline-templates
      parameters:
        awsServiceConnection: ${{ variables.awsServiceConnection }}
        awsRegion: ${{ variables.awsRegion }}
        serviceName: logto-audit-cleaner
        repositoryName: bb-logto-audit-cleaner
        pushTag: $(Build.BuildId)
  - stage: OGCIO_E2E_Tests
    displayName: OGCIO E2E Tests
    dependsOn: 
      - Build_Logto
      - Build_Logto_Audit_Cleaner
    condition: succeeded()
    jobs:
      - job: PlaywrightTests
        displayName: Run Playwright E2E Tests
        pool:
          vmImage: 'ubuntu-latest'
        
        variables:
          # Environment variables for the tests
          LOGTO_ADMIN_URL: 'http://localhost:3301'

        steps:
          - checkout: self
            displayName: 'Checkout source code'

          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: '20.x'

          - script: |
              npm install -g pnpm@9
            displayName: 'Install pnpm v9'

          - script: |
              # Install Playwright browsers with dependencies
              pnpm exec playwright install --with-deps chromium
            displayName: 'Install Playwright browsers'
            
          - script: |
              # Use the exact same setup as 'make run-native' for consistency
              echo "🚀 Setting up environment exactly like local 'make run-native'..."
              
              # Step 1: Copy .env file (exactly like makefile)
              echo "Copying .env file..."
              cp .env.sample .env
              echo "✅ .env file copied"
              
              # Step 2: Start PostgreSQL using docker-compose (exactly like makefile)
              echo "Starting database with docker-compose..."
              docker compose -f docker-compose-db.yml up --detach
              echo "✅ Database started"
              
              # Wait for database to be ready - simplified since we only need the core API
              echo "Waiting for PostgreSQL to be ready..."
              timeout 60 bash -c 'until docker compose -f docker-compose-db.yml exec postgres pg_isready; do echo "Waiting for PostgreSQL..."; sleep 2; done'
              echo "✅ PostgreSQL is accepting connections!"
              
              # Install postgresql-client to test the connection
              echo "Installing PostgreSQL client for connection testing..."
              sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
              
              # Simple connection test
              echo "Testing database connection..."
              timeout 30 bash -c 'until PGPASSWORD=p0stgr3s psql -h localhost -p 5433 -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; do echo "Testing connection..."; sleep 2; done'
              echo "✅ Database connection verified!"
              
              # Ensure the logto database exists
              echo "Ensuring logto database exists..."
              PGPASSWORD=p0stgr3s psql -h localhost -p 5433 -U postgres -c "CREATE DATABASE logto;" 2>/dev/null || echo "Database already exists (this is fine)"
              echo "✅ Logto database ready!"
              
              # Step 3: Install dependencies (exactly like makefile) - MOVED BEFORE seeding
              echo "Installing dependencies..."
              pnpm pnpm:devPreinstall && pnpm i && pnpm prepack
              echo "✅ Dependencies installed"
              
              # Step 4: Seed database with OGCIO data using the correct CLI syntax
              echo "Seeding database with OGCIO configuration..."
              npm run cli db seed -- --swe && npm run cli db alteration deploy latest && pnpm cli database ogcio --seeder-filepath packages/cli/src/commands/database/ogcio/ogcio-seeder-local.json
              echo "✅ Database seeded with OGCIO configuration"
              
              # Step 4.5: Build connectors (required for OGCIO connectors to be available)
              echo "Building connectors..."
              pnpm connectors build && pnpm cli connector link
              echo "✅ Connectors built"
              
              # Step 5: Start both Logto core API and MyGovId mock service
              echo "Starting Logto core API server and MyGovId mock service for testing..."
              
              # Build only the essential packages needed for core API
              echo "Building essential packages..."
              pnpm --filter @logto/shared build
              pnpm --filter @logto/schemas build  
              pnpm --filter @logto/phrases build
              pnpm --filter @logto/core build
              
              # Build the MyGovId mock service
              echo "Building MyGovId mock service..."
              cd mygovid-mock-service
              npm run build
              cd ..
              
              # Start the MyGovId mock service
              echo "Starting MyGovId mock service..."
              cd mygovid-mock-service
              npm start > ../mygovid-mock.log 2>&1 &
              MYGOVID_PID=$!
              cd ..
              
              # Start only the core API in development mode
              echo "Starting core API..."
              cd packages/core
              pnpm dev > ../../logto-core.log 2>&1 &
              LOGTO_PID=$!
              cd ../..
              
              # Wait for MyGovId mock service to be ready
              echo "Waiting for MyGovId mock service to start..."
              RETRY_COUNT=0
              MAX_RETRIES=30
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if curl -s -f http://localhost:4005/health > /dev/null; then
                  echo "✅ MyGovId mock service is ready!"
                  break
                fi
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Waiting for MyGovId mock service... (attempt $RETRY_COUNT of $MAX_RETRIES)"
                
                # Check if process is still running
                if ! ps -p $MYGOVID_PID > /dev/null; then
                  echo "❌ MyGovId mock service process died! Last 20 lines of log:"
                  tail -20 mygovid-mock.log
                  exit 1
                fi
                
                sleep 2
              done
              
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "❌ MyGovId mock service failed to start. Last 20 lines of log:"
                tail -20 mygovid-mock.log
                exit 1
              fi
              
              # Wait for Logto core API to be ready
              echo "Waiting for Logto core API to start..."
              RETRY_COUNT=0
              MAX_RETRIES=60
              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                if curl -s -f http://localhost:3301/api/status > /dev/null; then
                  echo "✅ Logto core API is ready!"
                  break
                fi
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "Waiting for Logto core API... (attempt $RETRY_COUNT of $MAX_RETRIES)"
                
                # Check if process is still running
                if ! ps -p $LOGTO_PID > /dev/null; then
                  echo "❌ Logto core API process died! Last 50 lines of log:"
                  tail -50 logto-core.log
                  exit 1
                fi
                
                sleep 3
              done
              
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "❌ Logto core API failed to start. Last 50 lines of log:"
                tail -50 logto-core.log
                exit 1
              fi
              
              echo "✅ Setup complete - both Logto core API and MyGovId mock service running!"
            displayName: 'Setup Environment (Identical to Local)'

          - script: |
              echo "🧪 Final verification..."
              
              # Health checks for both services required for E2E tests
              echo "Verifying Logto core API is ready..."
              curl -s -f http://localhost:3301/api/status > /dev/null && echo "✅ Logto core API healthy" || { echo "❌ Logto core API unhealthy"; exit 1; }
              
              echo "Verifying MyGovId mock service is ready..."
              curl -s -f http://localhost:4005/health > /dev/null && echo "✅ MyGovId mock service healthy" || { echo "❌ MyGovId mock service unhealthy"; exit 1; }
              
              echo "Verifying database connectivity..."
              docker compose -f docker-compose-db.yml exec postgres pg_isready > /dev/null && echo "✅ Database healthy" || { echo "❌ Database unhealthy"; exit 1; }
              
              echo "✅ All services ready for complete E2E testing!"
            displayName: 'Final Verification'

          - script: |
              echo "🚀 Running OGCIO E2E tests..."
              echo "All services are running - executing comprehensive OGCIO validation tests"
              
              # Run only the OGCIO-specific E2E tests (focused validation)
              pnpm exec playwright test ogcio-e2e-tests/ --reporter=line
              TEST_RESULT=$?
              
              if [ $TEST_RESULT -ne 0 ]; then
                echo "⚠️ OGCIO E2E tests failed. Check the test report for details."
                echo "Both Logto core API and MyGovId mock service were running correctly"
              else
                echo "✅ All OGCIO E2E tests passed!"
              fi
              
              exit $TEST_RESULT
            displayName: 'Run Playwright Tests'
            env:
              LOGTO_ADMIN_URL: $(LOGTO_ADMIN_URL)
              TEST_USERNAME: $(TEST_USERNAME)
              TEST_PASSWORD: $(TEST_PASSWORD)
              CI: true
              # Increase browser timeout
              PLAYWRIGHT_BROWSER_TIMEOUT: 180000

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/results.xml'
              testRunTitle: 'OGCIO E2E Tests - $(environment)'
              mergeTestResults: true

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Playwright Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Test Results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'test-results-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'
              
          # Collect minimal logs
          - script: |
              echo "📦 Collecting logs..."
              mkdir -p debug-artifacts
              cp logto-core.log debug-artifacts/ || echo "No logto core log found"
              cp mygovid-mock.log debug-artifacts/ || echo "No MyGovId mock log found"
            displayName: 'Collect Logs'
            condition: always()
            
          - task: PublishPipelineArtifact@1
            displayName: 'Upload Logs'
            condition: always()
            inputs:
              targetPath: 'debug-artifacts'
              artifact: 'logs-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'
  - stage: EnvApproval
    displayName: Approvals for deployments - ${{ upper(variables.environment) }}
    dependsOn:
      - Build_Logto
      - OGCIO_E2E_Tests
    condition: ${{ variables.pushArtefacts }}
    jobs:
    - deployment: VerifyDeployment
      displayName: Verify conditions for deployment
      environment: ${{ variables.environment }}
      strategy:
        runOnce:
          deploy:
            steps:
            - script: |
                date
              displayName: Show current date
  - stage: Push_Logto
    displayName: Push logto to ECR
    dependsOn: EnvApproval
    condition: and(${{ variables.pushArtefacts }}, succeeded())
    jobs:
    - template: build/push_image_ecr.yml@pipeline-templates
      parameters:
        awsServiceConnection: ${{ variables.awsServiceConnection }}
        awsRegion: ${{ variables.awsRegion }}
        serviceName: logto
        repositoryName: bb-logto
        pushTag: $(Build.BuildId)
  - stage: Push_MyGovId_Mock
    displayName: Push MyGovId Mock to ECR
    dependsOn: 
      - EnvApproval
      - Build_MyGovId_Mock
    condition: and(eq(variables['Build.SourceBranchName'], 'dev'), succeeded())
    jobs:
    - template: build/push_image_ecr.yml@pipeline-templates
      parameters:
        awsServiceConnection: ${{ variables.awsServiceConnection }}
        awsRegion: ${{ variables.awsRegion }}
        serviceName: mygovid-mock-service
        repositoryName: bb-mygovid-mock
        pushTag: $(Build.BuildId)
  - stage: Deploy_Openshift_MyGovId_Mock
    displayName: GitOps deploy MyGovId Mock
    dependsOn:
      - Push_MyGovId_Mock
    condition: succeeded()
    jobs:
    - template: deploy/gitops.yml@pipeline-templates
      parameters:
        serviceName: mygovid-mock
        clusterName: ${{ variables.clusterName }}
        newName: ${{ variables.ecrEndpoint }}/bb-mygovid-mock
        newTag: $(Build.BuildId)
        environment: dev
  - stage: Deploy_Openshift_Logto
    displayName: GitOps deploy Logto
    dependsOn:
      - EnvApproval
      - Push_Logto
      - Push_Logto_Audit_Cleaner
    condition: succeeded()
    jobs:
      - template: deploy/openshift-gitops.yml@pipeline-templates
        parameters:
          tag: $(Build.BuildId)
          manifestsRepositoryName: logto-k8s-apps
          services:
            - name: logto
              image: ${{ variables.ecrEndpoint }}/bb-logto
              ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/${{ variables['Build.SourceBranchName'] }}
              ${{ else }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/dev
            - name: bb-logto-audit-cleaner
              image: ${{ variables.ecrEndpoint }}/bb-logto-audit-cleaner
              ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/${{ variables['Build.SourceBranchName'] }}
              ${{ else }}:
                overlaysPath: logto/overlays/${{ variables.clusterName }}/dev
