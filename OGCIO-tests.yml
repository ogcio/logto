# OGCIO E2E Tests Pipeline

trigger:
  - dev
  - uat
  - prod

pr:
  autoCancel: true
  branches:
    include:
      - "*"

parameters:
  - name: validEnvironments
    type: object
    displayName: List of valid environments to run tests (do not change)
    default: ['dev', 'uat', 'prod']

variables:
  - ${{ if containsValue(parameters.validEnvironments ,variables['Build.SourceBranchName']) }}:
    - template: pipeline-variables/${{ coalesce(variables['Build.SourceBranchName'], 'fallback') }}.yml
  - ${{ else }}:
    - template: pipeline-variables/dev.yml
  - group: ogcio-e2e-test-credentials

resources:
  repositories:
    - repository: pipeline-templates
      type: github
      name: ogcio/building-blocks-pipelines
      ref: refs/tags/v0.5.2
      endpoint: ogcio

stages:
  - stage: SecurityScan
    displayName: Security Scans
    jobs:
      - template: security/gitleaks.yml@pipeline-templates

  - stage: OGCIO_E2E_Tests
    displayName: OGCIO E2E Tests
    dependsOn: SecurityScan
    jobs:
      - job: PlaywrightTests
        displayName: Run Playwright E2E Tests
        pool:
          vmImage: 'ubuntu-latest'
        
        variables:
          LOGTO_ADMIN_URL: 'https://logto-admin-$(environment).ogcio.gov.ie'
          TEST_USERNAME: $(TEST_USERNAME)
          TEST_PASSWORD: $(TEST_PASSWORD)

        steps:
          - checkout: self
            displayName: 'Checkout source code'

          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: '20.x'

          - script: |
              npm install -g pnpm
            displayName: 'Install pnpm'

          - script: |
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              npx playwright install chromium
            displayName: 'Install Playwright browsers'

          - script: |
              echo "Running tests against: $(LOGTO_ADMIN_URL)"
              echo "Environment: $(environment)"
              pnpm exec playwright test --project=chromium --reporter=junit
            displayName: 'Run Playwright Tests'
            env:
              LOGTO_ADMIN_URL: $(LOGTO_ADMIN_URL)
              TEST_USERNAME: $(TEST_USERNAME)
              TEST_PASSWORD: $(TEST_PASSWORD)
              CI: true

          - task: PublishTestResults@2
            displayName: 'Publish Test Results'
            condition: always()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/results.xml'
              testRunTitle: 'OGCIO E2E Tests - $(environment)'
              mergeTestResults: true

          - task: PublishHtmlReport@1
            displayName: 'Publish Playwright HTML Report'
            condition: always()
            inputs:
              reportDir: 'playwright-report'
              tabName: 'Playwright Report'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Playwright Report'
            condition: always()
            inputs:
              targetPath: 'playwright-report'
              artifact: 'playwright-report-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'

          - task: PublishPipelineArtifact@1
            displayName: 'Upload Test Results'
            condition: always()
            inputs:
              targetPath: 'test-results'
              artifact: 'test-results-$(environment)-$(System.JobId)'
              publishLocation: 'pipeline'
